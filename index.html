<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blox Value</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#090914;color:#fff}header{padding:22px 18px;border-bottom:1px solid #27273b;background:#101020;position:sticky;top:0}h1{margin:0;color:#b88cff}main{max-width:900px;margin:auto;padding:22px 16px}.hero{padding:22px 0}.hero h2{font-size:34px;margin:0 0 8px}.muted{color:#aaa}.search{width:100%;padding:14px;border-radius:12px;border:1px solid #393950;background:#151525;color:#fff;font-size:16px;margin:15px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#121223;border:1px solid #292940;border-radius:16px;padding:15px}.name{font-weight:700;font-size:17px}.value{font-size:24px;font-weight:800;color:#b88cff;margin-top:8px}.meta{font-size:13px;color:#aaa;margin-top:5px}.tag{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:8px;background:#25253a;color:#ddd}.calc{margin-top:30px;background:#121223;border:1px solid #292940;border-radius:16px;padding:18px}.calcrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.calc input{width:100%;padding:12px;border-radius:10px;border:1px solid #393950;background:#151525;color:#fff}.result{margin-top:15px;padding:13px;border-radius:10px;background:#1d1d30;text-align:center;font-weight:700}@media(max-width:600px){.calcrow{grid-template-columns:1fr}.hero h2{font-size:28px}}
</style>
</head>
<body><header><h1>🔥 BLOX VALUE</h1></header><main><section class="hero"><h2>Blox Value</h2><p class="muted">Valeurs des fruits Blox Fruits — snapshot de référence.</p><input id="search" class="search" placeholder="Rechercher un fruit..."></section><section id="grid" class="grid"></section><section class="calc"><h2>Trade Calculator</h2><div class="calcrow"><div><p>Ton offre (M)</p><input id="a" type="number" value="0"></div><div><p>Son offre (M)</p><input id="b" type="number" value="0"></div></div><div id="result" class="result">Entre les valeurs</div></section></main>
<script>
const fruits=[
['West Dragon',3630,10,'Overpaid'],['East Dragon',3060,10,'Overpaid'],['Kitsune',600,10,'Stable'],['Control',150,8,'Stable'],['Magnet',840,9,'Unstable'],['Yeti',110,7,'Stable'],['Gas',60,8,'Stable'],['Tiger',120,8,'Stable'],['Lightning',35,6,'Stable'],['Venom',20,7,'Stable'],['Dough',30,9,'Overpaid'],['Pain',10,5,'Stable'],['T-Rex',20,8,'Stable'],['Gravity',10,5,'Stable'],['Mammoth',10,5,'Stable'],['Spirit',10,7,'Stable'],['Shadow',6.5,5,'Stable'],['Portal',10,10,'Overpaid'],['Buddha',10,10,'Overpaid'],['Blizzard',5,5,'Stable'],['Creation',2.5,2,'Stable'],['Phoenix',2.75,3,'Stable'],['Sound',2.5,4,'Stable'],['Spider',1.5,2,'Stable']];
function money(v){return v>=1000?(v/1000).toFixed(v%1000?2:0)+'B':v+'M'}
function render(q=''){grid.innerHTML=fruits.filter(f=>f[0].toLowerCase().includes(q.toLowerCase())).map(f=>`<article class="card"><div class="name">${f[0]}</div><div class="value">${money(f[1])}</div><div class="meta">Demand: ${f[2]}/10</div><span class="tag">${f[3]}</span></article>`).join('')}
function calc(){let a=+document.getElementById('a').value||0,b=+document.getElementById('b').value||0;result.textContent=!a&&!b?'Entre les valeurs':a>b?'WIN 🟢':a<b?'LOSS 🔴':'FAIR 🟡'}
search.oninput=e=>render(e.target.value);a.oninput=b.oninput=calc;render();
</script></body></html>
